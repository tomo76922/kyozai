<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>なぞりがき</title>
  <meta name="description" content="ひらがな・カタカナ・すうじを、かきじゅんどおりに ゆびで なぞる きょうざい">
  <meta name="theme-color" content="#f3efe6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="きょうざい">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="icon" href="../icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
  <link rel="stylesheet" href="../common.css">
  <link rel="stylesheet" href="./nazori.css">
</head>
<body>
  <header class="header">
    <a class="home-btn" href="../" aria-label="もくじに もどる">
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 9.5V20h13V9.5"/></svg>
      <span class="home-text">もくじ</span>
    </a>
    <h1 class="title">なぞりがき</h1>
    <div class="tabs" role="tablist" aria-label="もじの しゅるい">
      <button type="button" class="tab" role="tab" id="tab-hira" data-set="hira"
              aria-controls="listView" aria-selected="true">ひらがな</button>
      <button type="button" class="tab" role="tab" id="tab-kata" data-set="kata"
              aria-controls="listView" aria-selected="false" tabindex="-1">カタカナ</button>
      <button type="button" class="tab" role="tab" id="tab-num" data-set="num"
              aria-controls="listView" aria-selected="false" tabindex="-1">すうじ</button>
    </div>
    <div class="seg thick" role="group" aria-label="せんの ふとさ">
      <button type="button" class="seg-btn" id="thinBtn" aria-pressed="true">ふつう</button>
      <button type="button" class="seg-btn" id="thickBtn" aria-pressed="false">ふとい</button>
    </div>
  </header>

  <p class="notice" id="notice" hidden></p>

  <main>
    <!-- いちらん：もじを えらぶ -->
    <section class="section" id="listView" role="tabpanel" aria-labelledby="tab-hira">
      <div class="list-card">
        <div class="chars" id="chars" aria-label="もじを えらんでね"></div>
      </div>
    </section>

    <!-- なぞる がめん -->
    <section class="section trace" id="traceView" hidden>
      <div class="board-wrap" id="boardWrap">
        <svg class="board" id="board" viewBox="0 0 109 109" role="img" aria-label="なぞる ところ">
          <rect class="paper" x="1" y="1" width="107" height="107" rx="6"/>
          <path class="cross" d="M54.5 4V105M4 54.5H105"/>
          <g id="guideG"></g>
          <g id="markG"></g>
          <g id="inkG"></g>
          <g id="demoG"></g>
          <g id="hanaG"></g>
        </svg>
      </div>

      <div class="panel">
        <button type="button" class="char-label" id="charLabel" aria-label="よみを きく">あ</button>
        <p class="stage-text" id="msg" aria-live="polite">1を なぞってね</p>
        <div class="panel-btns">
          <button type="button" class="btn" id="demoBtn">おてほん</button>
          <button type="button" class="btn" id="clearBtn">けす</button>
          <button type="button" class="btn next-btn" id="nextBtn">つぎ</button>
          <button type="button" class="btn back-btn" id="backBtn">いちらん</button>
        </div>
      </div>
    </section>
  </main>

  <footer class="credit">
    かきじゅんの データ：<a href="https://kanjivg.tagaini.net/" target="_blank" rel="noopener">KanjiVG</a>
    （© Ulrich Apel・<a href="https://creativecommons.org/licenses/by-sa/3.0/deed.ja" target="_blank" rel="noopener">CC BY-SA 3.0</a>）
    から 必要な もじの 線と ばんごうの 位置を 取り出して 使っています
  </footer>

  <script src="./strokes.js"></script>
  <script src="./nazori.js"></script>
  <script src="../pwa.js"></script>
</body>
</html>
