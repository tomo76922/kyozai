<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>しんけいすいじゃく</title>
  <meta name="description" content="おなじ えの カードを 2まい さがす、しんけいすいじゃくの きょうざい">
  <meta name="theme-color" content="#f3efe6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="きょうざい">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="icon" href="../icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
  <link rel="stylesheet" href="../common.css">
  <link rel="stylesheet" href="./shinkei.css">
</head>
<body>
  <header class="header" id="header">
    <a class="home-btn" id="homeBtn" href="../" aria-label="もくじに もどる">
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 9.5V20h13V9.5"/></svg>
      <span class="home-text">もくじ</span>
    </a>
    <h1 class="title" id="title">しんけいすいじゃく</h1>

    <!-- あそんでいる ときだけ 出す -->
    <div class="stats" id="stats" hidden>
      <p class="stat"><span class="stat-k">めくった</span><b class="stat-v" id="movesV">0</b><span class="stat-u">かい</span>
        <span class="stat-sep" aria-hidden="true"></span><span class="stat-k">じかん</span><b class="stat-v" id="timeV">0:00</b></p>
    </div>
    <div class="players" id="players" hidden>
      <p class="player p1" id="p1"><span class="p-name">ひとりめ</span><b class="p-v" id="p1v">0</b><span class="p-u">ペア</span><span class="p-turn">の ばん</span></p>
      <p class="player p2" id="p2"><span class="p-name">ふたりめ</span><b class="p-v" id="p2v">0</b><span class="p-u">ペア</span><span class="p-turn">の ばん</span></p>
    </div>

    <button type="button" class="btn sound-btn" id="soundBtn"></button>
  </header>

  <!-- はじめの がめん -->
  <main class="start" id="start">
    <section class="sec" aria-labelledby="hLevel">
      <h2 class="sec-h" id="hLevel">むずかしさ</h2>
      <div class="choices levels" id="levels" role="group" aria-labelledby="hLevel">
        <button type="button" class="choice level" data-level="easy" aria-pressed="false">
          <span class="choice-pic" id="picEasy"></span>
          <span class="choice-name">やさしい</span>
          <span class="choice-sub">16まい・どうぶつ</span>
          <span class="choice-best" data-best="easy"></span>
        </button>
        <button type="button" class="choice level" data-level="normal" aria-pressed="false">
          <span class="choice-pic" id="picNormal"></span>
          <span class="choice-name">ふつう</span>
          <span class="choice-sub">32まい・とちぎの たべもの</span>
          <span class="choice-best" data-best="normal"></span>
        </button>
        <button type="button" class="choice level" data-level="hard" aria-pressed="false">
          <span class="choice-pic" id="picHard"></span>
          <span class="choice-name">むずかしい</span>
          <span class="choice-sub">64まい・トランプ</span>
          <span class="choice-best" data-best="hard"></span>
        </button>
      </div>
    </section>

    <section class="sec" aria-labelledby="hWho">
      <h2 class="sec-h" id="hWho">あそぶ ひと</h2>
      <div class="choices whos" id="whos" role="group" aria-labelledby="hWho">
        <button type="button" class="choice who" data-players="1" aria-pressed="false">
          <span class="who-pic" aria-hidden="true"><i class="dot d1"></i></span>
          <span class="choice-name">ひとりで</span>
        </button>
        <button type="button" class="choice who" data-players="2" aria-pressed="false">
          <span class="who-pic" aria-hidden="true"><i class="dot d1"></i><i class="dot d2"></i></span>
          <span class="choice-name">ふたりで</span>
        </button>
      </div>
      <p class="note" id="whoNote"></p>
    </section>

    <!-- なまえ（イニシャルと いろの マーク）。ひとりで の ときだけ。おすと かえられる -->
    <div class="name-chip" id="nameChip"></div>
    <button type="button" class="btn go-btn" id="goBtn">はじめる</button>
    <p class="note warn" id="saveWarn" hidden>この iPad では きろくを ほぞん できません。</p>
  </main>

  <!-- あそぶ がめん -->
  <main class="play" id="play" hidden>
    <div class="board" id="board" role="grid" aria-label="カード"></div>
  </main>

  <!-- キラキラ -->
  <div class="fx" id="fx" aria-hidden="true"></div>

  <!-- ぜんぶ そろった -->
  <div class="overlay" id="clearEl" hidden>
    <div class="dlg clear-dlg" role="dialog" aria-modal="true" aria-labelledby="clearTitle">
      <div class="hanamaru" id="maru" aria-hidden="true"></div>
      <p class="dlg-title" id="clearTitle">ぜんぶ そろったね！</p>
      <p class="new-rec" id="newRec" hidden>しんきろく！</p>
      <p class="clear-who" id="clearWho" hidden></p>
      <div class="clear-stats">
        <p><span>めくった かいすう</span><b id="cMoves">0</b><span>かい</span></p>
        <p><span>じかん</span><b id="cTime">0びょう</b></p>
      </div>
      <p class="best-line" id="bestLine"></p>
      <div class="dlg-btns">
        <button type="button" class="btn btn-main" id="againBtn">もういちど</button>
        <button type="button" class="btn" id="toStartBtn">はじめの がめん</button>
      </div>
      <button type="button" class="btn send-btn" id="sendBtn" hidden><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="6.5" height="6.5" rx="1"/><rect x="14" y="3.5" width="6.5" height="6.5" rx="1"/><rect x="3.5" y="14" width="6.5" height="6.5" rx="1"/><path d="M14 14h2.5v2.5H14zM18 18h2.5v2.5H18zM14 20.5h1M20.5 14v1"/></svg><span>きろくを おくる</span></button>
    </div>
  </div>

  <!-- やめる？ -->
  <div class="overlay" id="quitEl" hidden>
    <div class="dlg" role="dialog" aria-modal="true" aria-labelledby="quitTitle">
      <p class="dlg-title" id="quitTitle">やめる？</p>
      <div class="dlg-btns">
        <button type="button" class="btn btn-main" id="resumeBtn">つづける</button>
        <button type="button" class="btn" id="quitStartBtn">はじめの がめん</button>
        <a class="btn" id="quitHomeBtn" href="../">やめる</a>
      </div>
    </div>
  </div>

  <script src="../shared/qr/qrcode.js"></script>
  <script src="../shared/kiroku.js"></script>
  <script src="./art.js"></script>
  <script src="./shinkei.js"></script>
  <script src="../pwa.js"></script>
</body>
</html>
