<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>しょうぎ</title>
  <meta name="description" content="こまを うごかして、あいての おうを つかまえる ゲーム">
  <meta name="theme-color" content="#f3efe6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="きょうざい">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="icon" href="../icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
  <link rel="stylesheet" href="../common.css">
  <link rel="stylesheet" href="./shogi.css">
</head>
<body>
  <script src="../shared/game-lock.js" data-guard="shogi"></script>
  <header class="header" id="header">
    <a class="home-btn" id="homeBtn" href="../" aria-label="もくじに もどる">
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 9.5V20h13V9.5"/></svg>
      <span class="home-text">もくじ</span>
    </a>
    <h1 class="title" id="title">しょうぎ</h1>
    <button type="button" class="btn sound-btn" id="soundBtn"></button>
  </header>

  <!-- はじめの がめん -->
  <main class="start" id="start">
    <section class="sec" aria-labelledby="hWho">
      <h2 class="sec-h" id="hWho">あそぶ ひと</h2>
      <div class="choices twos" role="group" aria-labelledby="hWho">
        <button type="button" class="choice who" data-players="1" aria-pressed="false">
          <span class="who-pic" aria-hidden="true"><svg class="pc-icon" viewBox="0 0 40 40"><rect x="5" y="7" width="30" height="21" rx="4" fill="#e6efe9" stroke="#3d3a35" stroke-width="3"/><circle cx="15" cy="17" r="2.6" fill="#3d3a35"/><circle cx="25" cy="17" r="2.6" fill="#3d3a35"/><path d="M14 23h12M20 28v5M12 34h16" stroke="#3d3a35" stroke-width="3" stroke-linecap="round"/></svg></span>
          <span class="choice-name">ひとりで</span>
          <span class="choice-sub">コンピュータと</span>
        </button>
        <button type="button" class="choice who" data-players="2" aria-pressed="false">
          <span class="who-pic" aria-hidden="true"><svg class="pc-icon" viewBox="0 0 40 40"><path d="M20 3l8 3 2 13H10l2-13z" fill="#f3d79a" stroke="#3d3a35" stroke-width="2.5" stroke-linejoin="round" transform="rotate(180 20 11)"/><path d="M20 21l8 3 2 13H10l2-13z" fill="#f3d79a" stroke="#3d3a35" stroke-width="2.5" stroke-linejoin="round"/></svg></span>
          <span class="choice-name">ふたりで</span>
          <span class="choice-sub">むかいあって</span>
        </button>
      </div>
    </section>

    <section class="sec" aria-labelledby="hKind">
      <h2 class="sec-h" id="hKind">しゅるい</h2>
      <div class="choices twos" role="group" aria-labelledby="hKind">
        <button type="button" class="choice kind" data-kind="mini" aria-pressed="false">
          <svg class="size-pic" viewBox="0 0 60 60" aria-hidden="true"><rect x="2" y="2" width="56" height="56" rx="5" fill="#f1cf87" stroke="#a87a32" stroke-width="3"/><path d="M13.2 2v56M24.4 2v56M35.6 2v56M46.8 2v56M2 13.2h56M2 24.4h56M2 35.6h56M2 46.8h56" stroke="#a87a32" stroke-width="1.5"/></svg>
          <span class="choice-name">ミニしょうぎ</span>
          <span class="choice-sub">5×5・こまが すくない</span>
        </button>
        <button type="button" class="choice kind" data-kind="hon" aria-pressed="false">
          <svg class="size-pic" viewBox="0 0 60 60" aria-hidden="true"><rect x="2" y="2" width="56" height="56" rx="5" fill="#f1cf87" stroke="#a87a32" stroke-width="3"/><path d="M8.2 2v56M14.4 2v56M20.7 2v56M26.9 2v56M33.1 2v56M39.3 2v56M45.6 2v56M51.8 2v56M2 8.2h56M2 14.4h56M2 20.7h56M2 26.9h56M2 33.1h56M2 39.3h56M2 45.6h56M2 51.8h56" stroke="#a87a32" stroke-width="1.2"/></svg>
          <span class="choice-name">ほんしょうぎ</span>
          <span class="choice-sub">9×9・ふつうの しょうぎ</span>
        </button>
      </div>
    </section>

    <section class="sec" id="secLevel" aria-labelledby="hLevel">
      <h2 class="sec-h" id="hLevel">コンピュータの つよさ</h2>
      <div class="choices levels" role="group" aria-labelledby="hLevel">
        <button type="button" class="choice level" data-level="easy" aria-pressed="false">
          <span class="stars" aria-hidden="true">★</span>
          <span class="choice-name">やさしい</span>
          <span class="choice-sub">ときどき まちがえる</span>
        </button>
        <button type="button" class="choice level" data-level="normal" aria-pressed="false">
          <span class="stars" aria-hidden="true">★★</span>
          <span class="choice-name">ふつう</span>
          <span class="choice-sub">すこし かんがえる</span>
        </button>
        <button type="button" class="choice level" data-level="strong" aria-pressed="false">
          <span class="stars" aria-hidden="true">★★★</span>
          <span class="choice-name">つよい</span>
          <span class="choice-sub">よく かんがえる</span>
        </button>
      </div>
    </section>

    <section class="sec" id="secFirst" aria-labelledby="hFirst">
      <h2 class="sec-h" id="hFirst">さきに さす ひと</h2>
      <div class="choices twos" role="group" aria-labelledby="hFirst">
        <button type="button" class="choice first" data-first="me" aria-pressed="false">
          <span class="choice-name">じぶん</span>
          <span class="choice-sub">あなたが せんて</span>
        </button>
        <button type="button" class="choice first" data-first="cpu" aria-pressed="false">
          <span class="choice-name">コンピュータ</span>
          <span class="choice-sub">あなたが ごて</span>
        </button>
      </div>
    </section>

    <section class="sec" aria-labelledby="hYomi">
      <h2 class="sec-h" id="hYomi">こまの よみがな</h2>
      <div class="choices twos" role="group" aria-labelledby="hYomi">
        <button type="button" class="choice yomi" data-yomi="1" aria-pressed="false">
          <span class="yomi-pic" aria-hidden="true"></span>
          <span class="choice-name">つける</span>
        </button>
        <button type="button" class="choice yomi" data-yomi="0" aria-pressed="false">
          <span class="yomi-pic" aria-hidden="true"></span>
          <span class="choice-name">つけない</span>
        </button>
      </div>
    </section>

    <p class="note" id="note"></p>
    <div class="start-btns">
      <button type="button" class="btn go-btn" id="goBtn">はじめる</button>
      <button type="button" class="btn" id="howBtn0">こまの うごきかた</button>
    </div>
  </main>

  <!-- あそぶ がめん -->
  <main class="play" id="play" hidden>
    <div class="side" id="side">
      <div class="turn" id="turn" aria-live="polite">
        <span class="turn-piece" id="turnPiece" aria-hidden="true"></span>
        <span class="turn-text" id="turnText"></span>
      </div>
      <div class="side-btns" id="playBtns">
        <button type="button" class="btn" id="undoBtn">
          <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
          <span>まった</span>
        </button>
        <button type="button" class="btn" id="hintBtn">
          <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21.5h4"/><path d="M12 2.5a6.5 6.5 0 0 0-3.8 11.8c.5.4.8 1 .8 1.7h6c0-.7.3-1.3.8-1.7A6.5 6.5 0 0 0 12 2.5z"/></svg>
          <span>ヒント</span>
        </button>
        <button type="button" class="btn how-btn" id="howBtn">
          <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l5.5 2 1.5 16.5H5L6.5 4.5z"/><path d="M12 9v6M9 12h6"/></svg>
          <span>こまの うごきかた</span>
        </button>
      </div>
      <p class="msg" id="msg"></p>
      <div class="end-btns" id="endBtns" hidden>
        <button type="button" class="btn btn-main" id="againBtn">もういちど</button>
        <button type="button" class="btn" id="toStartBtn">はじめの がめん</button>
      </div>
      <p class="tally" id="tally"></p>
    </div>
    <div class="board-wrap" id="boardWrap">
      <div class="bar bar-top" id="barTop" hidden></div>
      <div class="board-box" id="boardBox">
        <svg class="board" id="board" role="group" aria-label="しょうぎの ばん"></svg>
        <div class="pop" id="popEl" hidden><span class="pop-word" id="popWord"></span></div>
        <div class="promo" id="promoEl" hidden>
          <div class="promo-in" role="dialog" aria-modal="true" aria-labelledby="promoTitle">
            <p class="promo-title" id="promoTitle">なる？</p>
            <div class="promo-btns">
              <button type="button" class="promo-btn is-yes" id="promoYes"></button>
              <button type="button" class="promo-btn" id="promoNo"></button>
            </div>
          </div>
        </div>
      </div>
      <div class="bar bar-bot" id="barBot" hidden></div>
    </div>
  </main>

  <!-- キラキラ -->
  <div class="fx" id="fx" aria-hidden="true"></div>

  <!-- こまの うごきかた -->
  <div class="overlay" id="howEl" hidden>
    <div class="dlg how" id="howDlg" role="dialog" aria-modal="true" aria-labelledby="howTitle">
      <div class="how-head">
        <p class="dlg-title" id="howTitle">こまの うごきかた</p>
        <button type="button" class="btn" id="howFlipBtn" hidden>さかさまに する</button>
        <button type="button" class="btn btn-main" id="howClose">とじる</button>
      </div>
      <div class="how-body" id="howBody"></div>
    </div>
  </div>

  <!-- やめる？ -->
  <div class="overlay" id="quitEl" hidden>
    <div class="dlg" role="dialog" aria-modal="true" aria-labelledby="quitTitle">
      <p class="dlg-title" id="quitTitle">やめる？</p>
      <div class="dlg-btns">
        <button type="button" class="btn btn-main" id="resumeBtn">つづける</button>
        <button type="button" class="btn" id="quitStartBtn">はじめの がめん</button>
        <a class="btn" id="quitHomeBtn" href="../">やめる</a>
      </div>
    </div>
  </div>

  <script src="./rules.js"></script>
  <script src="./shogi.js"></script>
  <script src="../pwa.js"></script>
</body>
</html>
