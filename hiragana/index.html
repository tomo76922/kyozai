<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ひらがなカード</title>
  <meta name="description" content="タップすると読み上げる、ひらがな46文字のカード">
  <meta name="theme-color" content="#f3efe6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="ひらがな">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="icon" href="../icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
  <link rel="stylesheet" href="../common.css">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header class="header">
    <a class="home-btn" href="../" aria-label="もくじに もどる">
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 9.5V20h13V9.5"/></svg>
      <span class="home-text">もくじ</span>
    </a>
    <h1 class="title">ひらがな カード</h1>
    <div class="tabs" role="tablist" aria-label="ひょうじする もじ">
      <button type="button" class="tab" role="tab" id="tab-seion"
              aria-controls="sec-seion" aria-selected="true">あ〜ん</button>
      <button type="button" class="tab" role="tab" id="tab-dakuon"
              aria-controls="sec-dakuon" aria-selected="false" tabindex="-1">が・ざ・だ・ば・ぱ</button>
    </div>
    <button type="button" class="btn" id="speedBtn" aria-pressed="false">ゆっくり</button>
  </header>

  <p class="notice" id="notice" hidden></p>

  <main>
    <section class="section" id="sec-seion" role="tabpanel" aria-labelledby="tab-seion">
      <div class="grid" id="grid-seion" data-cols="11"></div>
    </section>
    <section class="section" id="sec-dakuon" role="tabpanel" aria-labelledby="tab-dakuon" hidden>
      <div class="grid" id="grid-dakuon" data-cols="5"></div>
    </section>
  </main>

  <script src="./app.js"></script>
  <script src="../pwa.js"></script>
</body>
</html>
