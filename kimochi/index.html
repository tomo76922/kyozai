<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>きもちカード</title>
  <meta name="description" content="きもちや からだの ようすを つたえる カード">
  <meta name="theme-color" content="#f3efe6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="きょうざい">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="icon" href="../icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
  <link rel="stylesheet" href="../common.css">
  <link rel="stylesheet" href="./kimochi.css">
</head>
<body>
  <header class="header">
    <a class="home-btn" href="../" aria-label="もくじに もどる">
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 9.5V20h13V9.5"/></svg>
      <span class="home-text">もくじ</span>
    </a>
    <h1 class="title">きもち カード</h1>
    <div class="tabs" role="tablist" aria-label="ひょうじする カード">
      <button type="button" class="tab" role="tab" id="tab-kimochi"
              aria-controls="sec-kimochi" aria-selected="true">きもち</button>
      <button type="button" class="tab" role="tab" id="tab-karada"
              aria-controls="sec-karada" aria-selected="false" tabindex="-1">からだ</button>
    </div>
    <button type="button" class="btn" id="speedBtn" aria-pressed="false">ゆっくり</button>
  </header>

  <p class="notice" id="notice" hidden></p>

  <main id="list">
    <section class="section" id="sec-kimochi" role="tabpanel" aria-labelledby="tab-kimochi">
      <div class="grid" id="grid-kimochi" data-set="kimochi"></div>
    </section>
    <section class="section" id="sec-karada" role="tabpanel" aria-labelledby="tab-karada" hidden>
      <div class="grid" id="grid-karada" data-set="karada"></div>
    </section>
  </main>

  <!-- カードを大きく見せる画面（タップで いちらんに もどる） -->
  <div class="big" id="big" role="dialog" aria-modal="true" aria-labelledby="bigLabel" hidden>
    <a class="home-btn big-home" href="../" aria-label="もくじに もどる">
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 9.5V20h13V9.5"/></svg>
      <span class="home-text">もくじ</span>
    </a>
    <button type="button" class="big-card" id="bigCard" aria-describedby="bigHint">
      <span class="big-pic" id="bigPic" aria-hidden="true"></span>
      <span class="big-label" id="bigLabel"></span>
    </button>
    <p class="big-hint" id="bigHint">タップで もどる</p>
  </div>

  <script src="./kimochi.js"></script>
  <script src="../pwa.js"></script>
</body>
</html>
