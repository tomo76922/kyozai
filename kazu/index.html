<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>かずあそび</title>
  <meta name="description" content="1から10までの かずを かぞえたり、いくつか あてたりする きょうざい">
  <meta name="theme-color" content="#f3efe6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="きょうざい">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="icon" href="../icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
  <link rel="stylesheet" href="../common.css">
  <link rel="stylesheet" href="./kazu.css">
</head>
<body>
  <header class="header">
    <a class="home-btn" href="../" aria-label="もくじに もどる">
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 9.5V20h13V9.5"/></svg>
      <span class="home-text">もくじ</span>
    </a>
    <h1 class="title">かず あそび</h1>
    <div class="tabs" role="tablist" aria-label="あそびかた">
      <button type="button" class="tab" role="tab" id="tab-count"
              aria-controls="sec-count" aria-selected="true">かぞえる</button>
      <button type="button" class="tab" role="tab" id="tab-quiz"
              aria-controls="sec-quiz" aria-selected="false" tabindex="-1">いくつかな</button>
    </div>
    <button type="button" class="btn" id="speedBtn" aria-pressed="false">ゆっくり</button>
  </header>

  <p class="notice" id="notice" hidden></p>

  <main>
    <!-- かぞえる：数字をタップすると、その数だけ 1つずつ 出てくる -->
    <section class="section" id="sec-count" role="tabpanel" aria-labelledby="tab-count">
      <div class="stage">
        <div class="frame" id="countFrame" aria-hidden="true"></div>
        <p class="stage-text" id="countText" aria-live="polite">すうじを タップしてね</p>
      </div>
      <div class="nums" id="countNums" aria-label="すうじ"></div>
    </section>

    <!-- いくつかな：いくつ あるか 下の数字から えらぶ -->
    <section class="section" id="sec-quiz" role="tabpanel" aria-labelledby="tab-quiz" hidden>
      <div class="toolbar">
        <div class="seg" role="group" aria-label="もんだいの はんい">
          <button type="button" class="seg-btn" id="range5" data-max="5" aria-pressed="true">1〜5</button>
          <button type="button" class="seg-btn" id="range10" data-max="10" aria-pressed="false">1〜10</button>
        </div>
        <button type="button" class="btn next-btn" id="nextBtn">つぎ</button>
      </div>
      <div class="stage">
        <div class="frame" id="quizFrame" role="img" aria-label="いくつ あるかな"></div>
        <p class="stage-text" id="quizText" aria-live="polite">いくつ あるかな？</p>
      </div>
      <div class="nums" id="quizNums" aria-label="こたえ"></div>
    </section>
  </main>

  <script src="./kazu.js"></script>
  <script src="../pwa.js"></script>
</body>
</html>
