<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>きせつクイズ</title>
  <meta name="description" content="きせつの はな・むし・ぎょうじ・たべもの・うたを えから あてる クイズ">
  <meta name="theme-color" content="#f3efe6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="きょうざい">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="icon" href="../icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
  <link rel="stylesheet" href="../common.css">
  <link rel="stylesheet" href="../shared/mondai.css">
  <link rel="stylesheet" href="./kisetsu.css">
</head>
<body>
  <!-- 画面の文字は data-t に [漢字:よみ] で書く。学年に合わせて kisetsu.js が表示を切り替える -->
  <header class="header">
    <a class="home-btn" href="../" aria-label="もくじに もどる">
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 9.5V20h13V9.5"/></svg>
      <span class="home-text">もくじ</span>
    </a>
    <h1 class="title" data-t="[季節:き.せつ]クイズ">きせつクイズ</h1>
    <button type="button" class="btn" id="furiBtn" aria-pressed="false">ふりがな</button>
    <button type="button" class="btn" id="speedBtn" aria-pressed="false">ゆっくり</button>
    <!-- 先生用：ながおし したときだけ ひらく -->
    <button type="button" class="md-gear" id="gearBtn" aria-label="せってい（ながおしで ひらく）">
      <span>せってい</span>
    </button>
    <p class="md-gear-hint" id="gearHint" role="status" hidden>ながく おして ください</p>
  </header>

  <div class="bar">
    <button type="button" class="btn back-btn" id="backBtn">
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5 8 12l7 7"/></svg>
      <span>もどる</span>
    </button>
    <h2 class="heading" id="heading"></h2>
    <p class="crumb" id="crumb"></p>
  </div>

  <p class="notice" id="notice" hidden></p>

  <main>
    <!-- 1. 学年 -->
    <section class="screen" id="scr-grade" hidden>
      <div class="cards cards-grade" id="gradeList"></div>
    </section>

    <!-- 2. 季節 -->
    <section class="screen" id="scr-season" hidden>
      <div class="cards cards-season" id="seasonList"></div>
    </section>

    <!-- 3. ジャンル -->
    <section class="screen" id="scr-genre" hidden>
      <div class="cards cards-genre" id="genreList"></div>
    </section>

    <!-- 4. クイズ -->
    <section class="screen quiz" id="scr-quiz" hidden>
      <div class="stage">
        <div class="pic" id="pic" role="img"></div>
      </div>
      <div class="side">
        <div class="q-row">
          <p class="question" id="question"></p>
          <button type="button" class="btn listen-btn" id="listenBtn" aria-label="よみあげ">
            <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor"/><path d="M15.5 9a4 4 0 0 1 0 6"/><path d="M18 6.5a7.5 7.5 0 0 1 0 11"/></svg>
          </button>
        </div>
        <div class="choices" id="choices"></div>
        <div class="q-foot">
          <p class="feedback" id="feedback" aria-live="polite"></p>
        </div>
        <div class="dots" id="dots" aria-hidden="true"></div>
      </div>
    </section>
  </main>

  <script src="./kanji.js"></script>
  <script src="./data.js"></script>
  <script src="../shared/mondai.js"></script>
  <script src="./kisetsu.js"></script>
  <script src="../pwa.js"></script>
</body>
</html>
