<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>とけい</title>
  <meta name="description" content="とけいの はりを うごかしたり、なんじか あてたりする きょうざい">
  <meta name="theme-color" content="#f3efe6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="きょうざい">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="icon" href="../icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
  <link rel="stylesheet" href="../common.css">
  <link rel="stylesheet" href="../shared/mondai.css">
  <link rel="stylesheet" href="./tokei.css">
</head>
<body>
  <header class="header">
    <a class="home-btn" href="../" aria-label="もくじに もどる">
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 9.5V20h13V9.5"/></svg>
      <span class="home-text">もくじ</span>
    </a>
    <h1 class="title">とけい</h1>
    <div class="tabs" role="tablist" aria-label="あそびかた">
      <button type="button" class="tab" role="tab" id="tab-move"
              aria-controls="sec-move" aria-selected="true">うごかす</button>
      <button type="button" class="tab" role="tab" id="tab-quiz"
              aria-controls="sec-quiz" aria-selected="false" tabindex="-1">なんじかな</button>
    </div>
    <button type="button" class="btn" id="speedBtn" aria-pressed="false">ゆっくり</button>
    <!-- 先生用：ながおし したときだけ ひらく -->
    <button type="button" class="md-gear" id="gearBtn" aria-label="せってい（ながおしで ひらく）">
      <span>せってい</span>
    </button>
    <p class="md-gear-hint" id="gearHint" role="status" hidden>ながく おして ください</p>
  </header>

  <p class="notice" id="notice" hidden></p>

  <main>
    <!-- うごかす：ながい はりを ゆびで うごかす -->
    <section class="section" id="sec-move" role="tabpanel" aria-labelledby="tab-move">
      <div class="toolbar">
        <p class="hint">ながい はりを ゆびで うごかしてね</p>
        <button type="button" class="btn" id="showBtn" aria-pressed="true">じこくを かくす</button>
      </div>
      <div class="stage">
        <div class="clock-box">
          <svg class="clock is-move" id="moveClock" viewBox="-100 -100 200 200" role="img" aria-label="とけい"></svg>
        </div>
        <p class="stage-text is-time" id="moveText" aria-live="polite"></p>
      </div>
    </section>

    <!-- なんじかな：とけいを みて、3つの こたえから えらぶ -->
    <section class="section" id="sec-quiz" role="tabpanel" aria-labelledby="tab-quiz" hidden>
      <div class="toolbar md-keep" id="quizBar">
        <div class="seg" role="group" aria-label="むずかしさ">
          <button type="button" class="seg-btn" data-level="0" aria-pressed="true">ちょうど</button>
          <button type="button" class="seg-btn" data-level="1" aria-pressed="false">ちょうど・はん</button>
          <button type="button" class="seg-btn" data-level="2" aria-pressed="false">5ふんごと</button>
          <button type="button" class="seg-btn" data-level="3" aria-pressed="false">1ぷんごと</button>
        </div>
      </div>
      <div class="quiz-body">
        <div class="stage">
          <div class="clock-box">
            <svg class="clock" id="quizClock" viewBox="-100 -100 200 200" role="img" aria-label="なんじかな"></svg>
          </div>
          <p class="stage-text" id="quizText" aria-live="polite">なんじ かな？</p>
        </div>
        <div class="answers" id="answers" aria-label="こたえ"></div>
      </div>
    </section>
  </main>

  <script src="../shared/mondai.js"></script>
  <script src="./tokei.js"></script>
  <script src="../pwa.js"></script>
</body>
</html>
