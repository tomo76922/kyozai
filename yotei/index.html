<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>よていボード</title>
  <meta name="description" content="きょうの よていを 絵と ことばの カードで ならべる ボード">
  <meta name="theme-color" content="#f3efe6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="きょうざい">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="icon" href="../icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
  <link rel="stylesheet" href="../common.css">
  <link rel="stylesheet" href="./yotei.css">
</head>
<body>
  <header class="header">
    <a class="home-btn" href="../" aria-label="もくじに もどる">
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 9.5V20h13V9.5"/></svg>
      <span class="home-text">もくじ</span>
    </a>
    <h1 class="title">きょうの よてい</h1>
    <button type="button" class="btn" id="speedBtn" aria-pressed="false">ゆっくり</button>
    <!-- 先生用：ながおし したときだけ ひらく -->
    <button type="button" class="gear" id="gearBtn" aria-label="せってい（ながおしで ひらく）">
      <span class="gear-text">せってい</span>
    </button>
    <p class="gear-hint" id="gearHint" role="status" hidden>ながく おして ください</p>
  </header>

  <p class="notice" id="notice" hidden></p>

  <main>
    <ol class="board" id="board" aria-label="きょうの よてい"></ol>
    <p class="empty" id="empty" hidden>よていは まだ ありません</p>
    <p class="all-done" id="allDone" hidden>ぜんぶ おわったね</p>
  </main>

  <!-- 先生が ならべる 画面 -->
  <div class="settings" id="settings" role="dialog" aria-modal="true" aria-labelledby="setTitle" hidden>
    <div class="set-inner">
      <div class="set-head">
        <h2 class="set-title" id="setTitle">よていを ならべる（せんせい よう）</h2>
        <button type="button" class="btn" id="closeBtn">とじる</button>
      </div>

      <p class="set-warn" id="saveWarn" hidden>この iPad では ほぞん できません。とじると もとに もどります。</p>

      <section class="set-sec" aria-labelledby="h-list">
        <h3 class="set-h" id="h-list">いまの よてい</h3>
        <p class="set-note">うえから じゅんに ならびます。じこくは いれなくても だいじょうぶです。</p>
        <ol class="edit-list" id="editList"></ol>
        <p class="set-note" id="editEmpty" hidden>まだ カードが ありません。したから えらんで たしてください。</p>
        <div class="set-row">
          <button type="button" class="btn btn-reset" id="resetBtn">はなまるを ぜんぶ けす</button>
          <span class="set-status" id="resetStatus" role="status"></span>
        </div>
      </section>

      <section class="set-sec" aria-labelledby="h-add">
        <h3 class="set-h" id="h-add">カードを えらんで たす</h3>
        <div class="preset-grid" id="presetGrid"></div>
        <p class="set-status" id="addStatus" role="status"></p>
      </section>

      <section class="set-sec" aria-labelledby="h-own">
        <h3 class="set-h" id="h-own">ことばを いれて つくる</h3>
        <form class="own-form" id="ownForm" autocomplete="off">
          <label class="own-label" for="ownWord">ことば</label>
          <input class="own-input" id="ownWord" type="text" maxlength="12" enterkeyhint="done"
                 placeholder="れい：ずこう">
          <button type="submit" class="btn">たす</button>
        </form>
      </section>
    </div>
  </div>

  <script src="./yotei.js"></script>
  <script src="../pwa.js"></script>
</body>
</html>
